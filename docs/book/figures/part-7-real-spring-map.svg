<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Part 7 Real Spring Map</title>
  <desc id="desc">Map from Spring Lite concepts to real Spring source code and practical usage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f5ef"/>
      <stop offset="100%" stop-color="#eae4d8"/>
    </linearGradient>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#3d3323}.sub{font:500 18px Arial,sans-serif;fill:#73624c}
      .box{fill:#fffdfa;stroke:#3d3323;stroke-width:2.5;rx:18;ry:18}.label{font:700 21px Arial,sans-serif;fill:#3d3323}
      .body{font:500 17px Arial,sans-serif;fill:#5f513f}.arrow{stroke:#3d3323;stroke-width:3;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d3323"/></marker>
