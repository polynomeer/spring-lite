  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="84" class="title">Part 7. From Spring Lite To Real Spring</text>
  <text x="70" y="116" class="sub">The last part turns the small implementation into a reading guide for real Spring code and a practical debugging model.</text>
  <rect x="92" y="234" width="220" height="104" class="box"/>
  <text x="132" y="292" class="label">25. Structure Map</text>
  <rect x="384" y="234" width="220" height="104" class="box"/>
