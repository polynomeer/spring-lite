  <path d="M312 286 L384 286" class="arrow"/>
  <path d="M604 286 L676 286" class="arrow"/>
  <path d="M896 286 L968 286" class="arrow"/>
  <rect x="196" y="454" width="882" height="136" class="box"/>
  <text x="234" y="510" class="label">Final learning loop</text>
