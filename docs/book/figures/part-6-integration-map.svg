  <rect x="174" y="460" width="936" height="126" class="box"/>
  <text x="212" y="512" class="label">Part outcome</text>
  <text x="212" y="548" class="body">The framework now persists data, runs an app end-to-end, starts with one entry point, and tests itself with reusable support.</text>
