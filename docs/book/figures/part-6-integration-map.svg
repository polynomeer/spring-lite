    <style>.title{font:700 34px Arial,sans-serif;fill:#5d311c}.sub{font:500 18px Arial,sans-serif;fill:#8c5a40}.box{fill:#fffdfa;stroke:#5d311c;stroke-width:2.5;rx:18;ry:18}.label{font:700 21px Arial,sans-serif;fill:#5d311c}.body{font:500 17px Arial,sans-serif;fill:#73462d}.arrow{stroke:#5d311c;stroke-width:3;fill:none;marker-end:url(#a)}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d311c"/></marker>
