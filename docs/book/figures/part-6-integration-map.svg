  <text x="70" y="116" class="sub">Data access, example app wiring, bootstrapping, and test support close the loop around the whole framework.</text>
  <rect x="92" y="228" width="196" height="96" class="box"/><text x="132" y="284" class="label">21. JDBC</text>
  <rect x="348" y="228" width="196" height="96" class="box"/><text x="375" y="284" class="label">22. Example App</text>
