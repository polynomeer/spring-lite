<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Transactional Boundary</title>
  <desc id="desc">Proxy-based declarative transaction flow in Spring Lite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef6f2"/>
      <stop offset="100%" stop-color="#ddeee6"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Helvetica Neue', Arial, sans-serif; fill: #163a2f; }
      .subtitle { font: 500 18px 'Helvetica Neue', Arial, sans-serif; fill: #46685b; }
      .lane { fill: #fbfffc; stroke: #1f4d3b; stroke-width: 2.5; rx: 18; ry: 18; }
      .label { font: 700 22px 'Helvetica Neue', Arial, sans-serif; fill: #143c30; }
      .body { font: 500 17px 'Helvetica Neue', Arial, sans-serif; fill: #335b4d; }
      .arrow { stroke: #163a2f; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .tx { fill: #e6fff1; stroke: #2f9e63; stroke-width: 2.5; rx: 16; ry: 16; }
      .warn { fill: #fff4df; stroke: #c5891d; stroke-width: 2; rx: 16; ry: 16; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#163a2f"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="72" y="82" class="title">Declarative Transaction Boundary</text>
  <text x="72" y="116" class="subtitle">@Transactional is metadata; the actual boundary is created by proxy, interceptor, and transaction manager.</text>

  <rect x="72" y="182" width="150" height="360" class="lane"/>
  <text x="108" y="228" class="label">Caller</text>
  <rect x="264" y="182" width="180" height="360" class="lane"/>
  <text x="300" y="228" class="label">Proxy</text>
  <rect x="486" y="182" width="220" height="360" class="lane"/>
  <text x="510" y="228" class="label">TransactionInterceptor</text>
  <rect x="748" y="182" width="180" height="360" class="lane"/>
  <text x="781" y="228" class="label">Target Service</text>
  <rect x="970" y="182" width="160" height="360" class="lane"/>
  <text x="1014" y="228" class="label">Repository</text>
  <rect x="1162" y="182" width="80" height="360" class="lane"/>
  <text x="1179" y="228" class="label">DB</text>

  <rect x="500" y="262" width="190" height="50" class="tx"/>
  <text x="540" y="294" class="body">begin()</text>
  <rect x="500" y="430" width="190" height="50" class="tx"/>
  <text x="525" y="462" class="body">commit() / rollback()</text>

  <path d="M222 280 L264 280" class="arrow"/>
  <path d="M444 280 L486 280" class="arrow"/>
  <path d="M706 344 L748 344" class="arrow"/>
  <path d="M928 344 L970 344" class="arrow"/>
  <path d="M1130 344 L1162 344" class="arrow"/>
  <path d="M1162 390 L1130 390" class="arrow"/>
  <path d="M970 390 L928 390" class="arrow"/>
  <path d="M748 390 L706 390" class="arrow"/>
  <path d="M486 510 L444 510" class="arrow"/>
  <path d="M264 510 L222 510" class="arrow"/>

  <rect x="72" y="580" width="516" height="92" class="warn"/>
  <text x="104" y="620" class="label">Self-invocation warning</text>
  <text x="104" y="650" class="body">Internal calls bypass the proxy, so the boundary is never opened.</text>

  <rect x="628" y="580" width="542" height="92" class="warn"/>
  <text x="660" y="620" class="label">Read the boundary, not the annotation</text>
  <text x="660" y="650" class="body">The annotation describes policy, but the real behavior lives on the call path.</text>
</svg>
