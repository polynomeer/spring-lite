<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Boot Orchestration</title>
  <desc id="desc">Spring Lite bootstrapping orchestration from run method to server start.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff5ef"/>
      <stop offset="100%" stop-color="#ffe8dc"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Helvetica Neue', Arial, sans-serif; fill: #5a2f19; }
      .subtitle { font: 500 18px 'Helvetica Neue', Arial, sans-serif; fill: #8a5234; }
      .box { fill: #fffdfa; stroke: #5a2f19; stroke-width: 2.5; rx: 18; ry: 18; }
      .label { font: 700 21px 'Helvetica Neue', Arial, sans-serif; fill: #5a2f19; }
      .body { font: 500 17px 'Helvetica Neue', Arial, sans-serif; fill: #6f462b; }
      .arrow { stroke: #5a2f19; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a2f19"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="72" y="82" class="title">Boot Turns Many Manual Steps Into One Entry Point</text>
  <text x="72" y="116" class="subtitle">SpringLiteApplication.run() orchestrates existing modules rather than creating a new runtime model.</text>

  <rect x="90" y="214" width="170" height="90" class="box"/>
  <text x="129" y="267" class="label">run()</text>

  <rect x="320" y="180" width="190" height="130" class="box"/>
  <text x="355" y="232" class="label">Load Inputs</text>
  <text x="355" y="266" class="body">args</text>
  <text x="355" y="292" class="body">application.yml</text>

  <rect x="570" y="180" width="190" height="130" class="box"/>
  <text x="605" y="232" class="label">Register Config</text>
  <text x="605" y="266" class="body">application class</text>
  <text x="605" y="292" class="body">boot defaults</text>

  <rect x="820" y="180" width="190" height="130" class="box"/>
  <text x="865" y="232" class="label">Refresh</text>
  <text x="850" y="266" class="body">create managed beans</text>
  <text x="852" y="292" class="body">wire web infra</text>

  <rect x="1070" y="180" width="150" height="130" class="box"/>
  <text x="1098" y="232" class="label">Start</text>
  <text x="1098" y="266" class="body">web server</text>
  <text x="1098" y="292" class="body">ready</text>

  <path d="M260 259 L320 245" class="arrow"/>
  <path d="M510 245 L570 245" class="arrow"/>
  <path d="M760 245 L820 245" class="arrow"/>
  <path d="M1010 245 L1070 245" class="arrow"/>

  <rect x="160" y="430" width="960" height="170" class="box"/>
  <text x="196" y="482" class="label">What Boot actually does</text>
  <text x="196" y="526" class="body">It chooses defaults, composes existing infrastructure, and standardizes startup order.</text>
  <text x="196" y="562" class="body">The complexity is still real, but it now lives behind an orchestrated entry point.</text>
</svg>
