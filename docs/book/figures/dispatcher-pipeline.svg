<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dispatcher Pipeline</title>
  <desc id="desc">Front controller pipeline in Spring Lite MVC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef3fb"/>
      <stop offset="100%" stop-color="#dde8fb"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Helvetica Neue', Arial, sans-serif; fill: #1f2f52; }
      .subtitle { font: 500 18px 'Helvetica Neue', Arial, sans-serif; fill: #50658f; }
      .box { fill: #fbfdff; stroke: #1f2f52; stroke-width: 2.5; rx: 18; ry: 18; }
      .label { font: 700 21px 'Helvetica Neue', Arial, sans-serif; fill: #1f2f52; }
      .body { font: 500 17px 'Helvetica Neue', Arial, sans-serif; fill: #42526e; }
      .arrow { stroke: #1f2f52; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .tag404 { fill: #ffe9dd; stroke: #d8612b; stroke-width: 2; rx: 12; ry: 12; }
      .tag400 { fill: #fff5d8; stroke: #c99711; stroke-width: 2; rx: 12; ry: 12; }
      .tag500 { fill: #ffe4ea; stroke: #d6456c; stroke-width: 2; rx: 12; ry: 12; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2f52"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="72" y="82" class="title">DispatcherServlet As A Pipeline</text>
  <text x="72" y="116" class="subtitle">The request is not routed directly to a controller; it flows through matching, binding, execution, and rendering stages.</text>

  <rect x="70" y="260" width="156" height="92" class="box"/>
  <text x="110" y="312" class="label">Request</text>

  <rect x="266" y="230" width="182" height="150" class="box"/>
  <text x="302" y="280" class="label">DispatcherServlet</text>
  <text x="302" y="315" class="body">orchestrates the whole</text>
  <text x="302" y="341" class="body">request algorithm</text>

  <rect x="488" y="230" width="170" height="150" class="box"/>
  <text x="524" y="280" class="label">HandlerMapping</text>
  <text x="524" y="315" class="body">find route + method</text>

  <rect x="698" y="230" width="180" height="150" class="box"/>
  <text x="734" y="280" class="label">HandlerAdapter</text>
  <text x="734" y="315" class="body">prepare invocation</text>

  <rect x="918" y="170" width="182" height="120" class="box"/>
  <text x="950" y="220" class="label">ArgumentResolvers</text>
  <text x="950" y="252" class="body">path, query, body</text>

  <rect x="918" y="330" width="182" height="120" class="box"/>
  <text x="962" y="380" class="label">Controller</text>
  <text x="950" y="412" class="body">business entry point</text>

  <rect x="1140" y="170" width="104" height="120" class="box"/>
  <text x="1160" y="220" class="label">Return</text>
  <text x="1165" y="252" class="body">Value</text>

  <rect x="1140" y="330" width="104" height="120" class="box"/>
  <text x="1158" y="380" class="label">Exception</text>
  <text x="1167" y="412" class="body">Resolver</text>

  <rect x="1110" y="520" width="134" height="92" class="box"/>
  <text x="1145" y="572" class="label">Response</text>

  <path d="M226 306 L266 306" class="arrow"/>
  <path d="M448 306 L488 306" class="arrow"/>
  <path d="M658 306 L698 306" class="arrow"/>
  <path d="M878 306 L918 230" class="arrow"/>
  <path d="M878 306 L918 390" class="arrow"/>
  <path d="M1100 230 L1140 230" class="arrow"/>
  <path d="M1100 390 L1140 390" class="arrow"/>
  <path d="M1192 290 L1177 520" class="arrow"/>
  <path d="M1192 450 L1177 520" class="arrow"/>

  <rect x="488" y="502" width="124" height="62" class="tag404"/>
  <text x="530" y="541" class="body">404</text>
  <rect x="700" y="502" width="124" height="62" class="tag400"/>
  <text x="742" y="541" class="body">400</text>
  <rect x="912" y="502" width="124" height="62" class="tag500"/>
  <text x="954" y="541" class="body">500</text>

  <text x="486" y="590" class="body">no handler matched</text>
  <text x="686" y="590" class="body">binding / validation failed</text>
  <text x="905" y="590" class="body">execution or unresolved error</text>
</svg>
